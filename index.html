<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">

<title>Narburger Cartoon Studio</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

header{
  padding:22px 18px;
  text-align:center;
  border-bottom:1px solid #252525;
  background:#0d0d0d;
}

.logo{
  font-size:30px;
  font-weight:900;
}

.logo span{color:#e62929}

.subtitle{
  margin-top:5px;
  color:#999;
  font-size:13px;
}

.wrap{
  width:min(760px,100%);
  margin:auto;
  padding:18px;
}

.card{
  background:#141414;
  border:1px solid #292929;
  border-radius:22px;
  padding:18px;
  margin-bottom:16px;
}

h2{
  margin:0 0 14px;
  font-size:18px;
}

.upload{
  min-height:210px;
  border:2px dashed #444;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
  cursor:pointer;
  background:#0c0c0c;
}

.upload:hover{
  border-color:#e62929;
}

.upload img{
  width:100%;
  max-height:420px;
  object-fit:contain;
  display:none;
}

.uploadText{
  padding:30px;
  color:#aaa;
}

.uploadIcon{
  font-size:48px;
  margin-bottom:10px;
}

input[type=file]{
  display:none;
}

label.title{
  display:block;
  margin:14px 0 7px;
  font-size:13px;
  color:#aaa;
}

textarea{
  width:100%;
  min-height:105px;
  border:1px solid #333;
  border-radius:14px;
  background:#0a0a0a;
  color:white;
  padding:14px;
  font-size:16px;
  resize:vertical;
}

.styles{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.styleBtn{
  padding:13px 8px;
  border:1px solid #333;
  border-radius:13px;
  background:#0b0b0b;
  color:#ddd;
  font-weight:700;
  cursor:pointer;
}

.styleBtn.active{
  border-color:#e62929;
  background:#321010;
  color:#fff;
}

.generate{
  width:100%;
  border:0;
  border-radius:16px;
  padding:17px;
  font-size:17px;
  font-weight:900;
  color:#fff;
  background:#e62929;
  cursor:pointer;
}

.generate:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.status{
  display:none;
  margin-top:15px;
  background:#0b0b0b;
  border-radius:14px;
  padding:14px;
  color:#ddd;
}

.loader{
  width:20px;
  height:20px;
  display:inline-block;
  border:3px solid #555;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
  vertical-align:middle;
  margin-right:8px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#error{
  display:none;
  margin-top:12px;
  color:#ff7777;
  font-size:14px;
  line-height:1.45;
}

#resultCard{
  display:none;
}

video{
  width:100%;
  border-radius:16px;
  background:#000;
}

.small{
  color:#777;
  font-size:12px;
  margin-top:10px;
  line-height:1.5;
}

.badge{
  display:inline-block;
  background:#292929;
  color:#bbb;
  padding:5px 9px;
  border-radius:20px;
  font-size:11px;
  margin-bottom:12px;
}

@media(max-width:520px){
  .styles{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>
  <div class="logo">🍔 Narburger <span>Studio</span></div>
  <div class="subtitle">AI Reklam & Cartoon Video Studio · V2</div>
</header>

<main class="wrap">

  <section class="card">
    <div class="badge">1 · FOTOĞRAF</div>
    <h2>Ürün fotoğrafını seç</h2>

    <label class="upload" for="photo">
      <div class="uploadText" id="uploadText">
        <div class="uploadIcon">📸</div>
        <strong>Fotoğraf Seç</strong><br>
        <small>iPhone / iPad fotoğraf arşivinden</small>
      </div>

      <img id="preview" alt="Önizleme">
    </label>

    <input id="photo" type="file" accept="image/*">
  </section>


  <section class="card">
    <div class="badge">2 · SAHNE</div>
    <h2>Reklam fikrini yaz</h2>

    <textarea id="prompt"
      placeholder="Örn: Burger masanın üzerinde. Kamera burgere yaklaşsın, cheddar erisin, sinematik reklam filmi gibi olsun."></textarea>

    <label class="title">Video tarzı</label>

    <div class="styles">
      <button class="styleBtn active" data-style="cartoon">
        🎨 Çizgi Film
      </button>

      <button class="styleBtn" data-style="cinematic">
        🎬 Sinematik
      </button>

      <button class="styleBtn" data-style="retro">
        📺 Retro Reklam
      </button>

      <button class="styleBtn" data-style="food">
        🍔 Food Commercial
      </button>
    </div>
  </section>


  <section class="card">
    <div class="badge">3 · ÜRET</div>

    <button id="generate" class="generate">
      🎬 VİDEO OLUŞTUR
    </button>

    <div id="status" class="status">
      <span class="loader"></span>
      <span id="statusText">Hazırlanıyor...</span>
    </div>

    <div id="error"></div>

    <div class="small">
      Yapay zekâ video üretimi birkaç dakika sürebilir.
      Sayfayı üretim sırasında kapatma.
    </div>
  </section>


  <section class="card" id="resultCard">
    <div class="badge">4 · SONUÇ</div>
    <h2>🎉 Videon hazır</h2>

    <video id="video" controls playsinline></video>
  </section>

</main>


<script>

const API =
  "https://narburger-video-api.ozturkhkn.workers.dev";

const photo = document.getElementById("photo");
const preview = document.getElementById("preview");
const uploadText = document.getElementById("uploadText");

const promptBox = document.getElementById("prompt");
const generateBtn = document.getElementById("generate");

const statusBox = document.getElementById("status");
const statusText = document.getElementById("statusText");

const errorBox = document.getElementById("error");

const resultCard = document.getElementById("resultCard");
const video = document.getElementById("video");

let selectedStyle = "cartoon";
let imageData = null;


document.querySelectorAll(".styleBtn").forEach(btn => {

  btn.addEventListener("click", () => {

    document.querySelectorAll(".styleBtn")
      .forEach(x => x.classList.remove("active"));

    btn.classList.add("active");

    selectedStyle = btn.dataset.style;

  });

});


photo.addEventListener("change", () => {

  const file = photo.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = e => {

    imageData = e.target.result;

    preview.src = imageData;
    preview.style.display = "block";

    uploadText.style.display = "none";

  };

  reader.readAsDataURL(file);

});


function buildPrompt(){

  const userPrompt =
    promptBox.value.trim() ||
    "A delicious premium burger advertisement.";

  const styles = {

    cartoon:
      "High quality animated cartoon commercial, playful smooth animation, professional food advertising, vibrant scene.",

    cinematic:
      "Premium cinematic food commercial, dramatic lighting, slow camera movement, shallow depth of field, highly appetizing.",

    retro:
      "Stylish American retro burger commercial, vintage diner atmosphere, energetic advertising animation.",

    food:
      "Professional modern fast food commercial, delicious burger hero shot, smooth camera movement, appetizing food photography."

  };

  return `${styles[selectedStyle]} ${userPrompt}
Keep the burger recognizable and realistic.
No distorted food. No unwanted text or logos.`;

}


function sleep(ms){
  return new Promise(resolve => setTimeout(resolve,ms));
}


async function checkStatus(id){

  for(let i=0;i<120;i++){

    statusText.textContent =
      `Video hazırlanıyor... ${i+1}`;

    const response =
      await fetch(
        `${API}/status?id=${encodeURIComponent(id)}`
      );

    const data = await response.json();

    if(!response.ok)
      throw new Error(
        data.error || "Durum kontrolü başarısız."
      );

    if(
      data.status === "COMPLETED" ||
      data.status === "completed"
    ){
      return;
    }

    if(
      data.status === "FAILED" ||
      data.status === "failed"
    ){
      throw new Error("Video üretimi başarısız oldu.");
    }

    await sleep(5000);

  }

  throw new Error(
    "Video üretimi beklenenden uzun sürdü."
  );

}


function findVideoURL(data){

  return (
    data?.video?.url ||
    data?.video_url ||
    data?.output?.video?.url ||
    data?.data?.video?.url ||
    null
  );

}


generateBtn.addEventListener("click", async () => {

  errorBox.style.display = "none";
  resultCard.style.display = "none";

  if(!imageData){

    errorBox.textContent =
      "Önce bir ürün fotoğrafı seç.";

    errorBox.style.display = "block";

    return;
  }

  generateBtn.disabled = true;
  statusBox.style.display = "block";

  try{

    statusText.textContent =
      "Video isteği gönderiliyor...";

    const response = await fetch(
      `${API}/generate`,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          image_url:imageData,
          prompt:buildPrompt()
        })
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.detail ||
        data.error ||
        "Video isteği gönderilemedi."
      );
    }

    const requestId =
      data.request_id ||
      data.requestId;

    if(!requestId){
      throw new Error(
        "fal.ai request_id döndürmedi."
      );
    }

    await checkStatus(requestId);

    statusText.textContent =
      "Video alınıyor...";

    const resultResponse =
      await fetch(
        `${API}/result?id=${encodeURIComponent(requestId)}`
      );

    const result =
      await resultResponse.json();

    if(!resultResponse.ok){
      throw new Error(
        result.error ||
        "Video sonucu alınamadı."
      );
    }

    const videoURL =
      findVideoURL(result);

    if(!videoURL){
      console.log(result);

      throw new Error(
        "Video üretildi ancak video adresi bulunamadı."
      );
    }

    video.src = videoURL;

    resultCard.style.display = "block";

    statusBox.style.display = "none";

    resultCard.scrollIntoView({
      behavior:"smooth"
    });

  }
  catch(error){

    statusBox.style.display = "none";

    errorBox.textContent =
      "⚠️ " + error.message;

    errorBox.style.display = "block";

  }
  finally{

    generateBtn.disabled = false;

  }

});

</script>

</body>
</html>
